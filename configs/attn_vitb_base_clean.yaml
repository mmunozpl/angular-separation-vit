# ViT-B base (sin R_div) sobre ImageNet-100 LIMPIO (confirmatorio).
# ancla del trio multi-arquitectura; lambda_div=0 aisla el baseline.
# escribe en el subarbol limpio vitb_clean (el blur esta archivado en
# artifacts_smoke_blur/).

seed: 42

dataset:
  name: imagenet100
  root: /media/manpla/ST2TB/kaggle/in100
  train_subdir: train
  val_subdir: val
  num_classes: 100               # se ignora si wnids_file esta
  wnids_file: configs/imagenet100_cmc.txt  # canonica CMC (coincide)
  image_size: 224
  num_workers: 8

model:
  name: vit_base_patch16_224
  pretrained: true
  num_heads: 12
  num_layers: 12
  embed_dim: 768

loss:
  ce_label_smoothing: 0.1
  lambda_div: 0.0           # sin regulador (base)
  hard_variant: false

code:
  path: artifacts/codes/heads_vitb_layer.pt

optimization:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.05
  batch_size: 128
  epochs: 30
  warmup_epochs: 3

device: cuda
log_dir: artifacts/logs/vitb_clean
checkpoint_dir: artifacts/checkpoints/vitb_clean
