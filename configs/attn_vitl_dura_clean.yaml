# ViT-L DURA (variante hard: reproyecta sobre el codigo tras cada step,
# impone la diversidad por construccion) sobre ImageNet-100 LIMPIO.
# hard_variant=true, lambda_div=0 (la reproyeccion hace el trabajo, sin
# backprop por la SVD). mide la columna dura de tab:divattn en ViT-L:
# theta_min clava el codigo (~93,82 con signo) pagando coste.
# batch 64 (modelo 3x el ViT-B); escribe en el subarbol vitl_clean.

seed: 42

dataset:
  name: imagenet100
  root: /media/manpla/ST2TB/kaggle/in100
  train_subdir: train
  val_subdir: val
  num_classes: 100
  wnids_file: configs/imagenet100_cmc.txt
  image_size: 224
  num_workers: 8

model:
  name: vit_large_patch16_224
  pretrained: true
  num_heads: 16
  num_layers: 24
  embed_dim: 1024

loss:
  ce_label_smoothing: 0.1
  lambda_div: 0.0           # la dura impone por reproyeccion, no por loss
  hard_variant: true        # reproyecta al codigo tras cada step

code:
  path: artifacts/codes/heads_vitl_layer.pt

optimization:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.05
  batch_size: 64
  epochs: 30
  warmup_epochs: 3

device: cuda
log_dir: artifacts/logs/vitl_clean
checkpoint_dir: artifacts/checkpoints/vitl_clean
