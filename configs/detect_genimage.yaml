# configuración para la contribución B: detección leave-one-generator-out

seed: 42
# multi-semilla para LOGO: cada (semilla, generador) es una corrida
# independiente; aggregate.py reduce por generador (mean ± std).
seeds: [42, 43, 44]

# tipo de cabeza:
#   proto  → PrototypeHead anclada al código (paper §490)
#   linear → LinearHead estándar con CE (baseline Tabla 3 fila 1)
head:
  type: proto

dataset:
  name: genimage
  # estructura esperada (ya extraída con bsdtar en streaming):
  #   <root>/<Generator>/<train|val>/<ai|nature>/*.png
  # antes de entrenar, correr scripts/verify_genimage_b0.py (Fase B0).
  root: /media/manpla/ST2TB/GenImage
  image_size: 256
  num_workers: 8
  # nombres tal cual aparecen en genimage_metadata.csv; ajustar a las
  # carpetas reales tras extraer (verify_genimage_b0 lo comprueba)
  generators:
    - stable_diffusion_v_1_4
    - stable_diffusion_v_1_5
    - ADM
    - glide
    - Midjourney
    - VQDM
    - wukong
    - BigGAN
  real_subdir: nature              # carpeta de imágenes reales
  # auditoría #7 / Fase B0: verificado sobre genimage_metadata.csv que
  # las reales son DISJUNTAS entre generadores (cada nombre ImageNet en
  # un solo generador). Se concatenan todas -> balance ~0,99:1; no hay
  # que deduplicar. Ver scripts/verify_genimage_b0.py --metadata.

model:
  name: vit_base_patch16_224
  pretrained: true
  embed_dim: 768

proto_head:
  num_protos: 9             # M+1 = 8 generadores + clase real
  feature_dim: 768
  code_path: artifacts/codes/protos_genimage.pt
  mode: fixed               # alterna a 'init_finetune' para afinar
  margin_deg: 20.0          # margen angular en grados
  scale: 30.0               # factor de escala de los cosenos

optimization:
  optimizer: adamw
  lr: 5.0e-5
  weight_decay: 0.05
  batch_size: 64
  epochs: 10

device: cuda
log_dir: artifacts/logs/detect
checkpoint_dir: artifacts/checkpoints/detect
