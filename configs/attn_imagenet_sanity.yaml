# sanity de la contribución A sobre val_blurred
# reparte el split de validación en 90% train / 10% val por clase
# para validar el pipeline antes de que llegue train_blurred.

seed: 42

dataset:
  name: imagenet100_sanity
  mode: sanity
  root: /media/manpla/Pruebas/Imagenet
  val_subdir: val_blurred
  num_classes: 100          # 100 synsets ~ 5000 imgs
  val_fraction: 0.1         # 90/10 estratificado por clase
  image_size: 224
  num_workers: 8

model:
  name: vit_base_patch16_224
  pretrained: true          # exige descarga timm la 1.ª vez
  num_heads: 12
  num_layers: 12
  embed_dim: 768

loss:
  ce_label_smoothing: 0.1
  # nueva formulación: sum sobre pares ordenados × capas
  lambda_div: 0.001
  # theta_target_deg se toma del código cacheado (95.22° para H=12,
  # D=768); descomentar para forzar otro valor
  # theta_target_deg: 95.22
  hard_variant: false

code:
  path: artifacts/codes/heads_vitb_layer.pt

optimization:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.05
  batch_size: 64
  epochs: 3                 # smoke: 3 épocas
  warmup_epochs: 0

device: cuda
log_dir: artifacts/logs/attn_sanity
checkpoint_dir: artifacts/checkpoints/attn_sanity
