# smoke base: 5 clases CMC × 50 imgs × 2 épocas, λ_A=0
seed: 42

dataset:
  name: smoke_base
  root: /media/manpla/ST2TB/Imagenet
  train_subdir: train_blurred
  val_subdir: val_blurred
  num_classes: 5
  wnids_file: configs/imagenet5_smoke.txt
  max_per_class: 50           # ← acota imgs por clase
  image_size: 224
  num_workers: 4

model:
  name: vit_base_patch16_224
  pretrained: true
  num_heads: 12
  num_layers: 12
  embed_dim: 768

loss:
  ce_label_smoothing: 0.1
  lambda_div: 0.0             # ← BASE, sin regulador
  hard_variant: false

code:
  path: artifacts/codes/heads_vitb_layer.pt

optimization:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.05
  batch_size: 32
  epochs: 2
  warmup_epochs: 0

device: cuda
log_dir: artifacts/logs/smoke_base
checkpoint_dir: artifacts/checkpoints/smoke_base
