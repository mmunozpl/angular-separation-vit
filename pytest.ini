[pytest]
# se silencia la deprecación interna de torch 2.9 sobre
# Tensor.pin_memory(device): la emite el worker del DataLoader,
# no afecta a nuestro código.
filterwarnings =
    ignore:The argument 'device' of Tensor.pin_memory.*:DeprecationWarning
    ignore:The argument 'device' of Tensor.is_pinned.*:DeprecationWarning
